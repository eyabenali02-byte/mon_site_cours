<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Cours & TD corrigés</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- EN-TÊTE -->
    <header>
        <h1>📚 Mes Cours & TD corrigés</h1>
        <p>Pour aider les nouveaux étudiants 🎓</p>
    </header>

    <!-- RECHERCHE -->
    <div class="recherche">
        <input type="text" id="searchInput" placeholder="🔍 Rechercher un cours...">
        <select id="filterSelect">
            <option value="all">Toutes les matières</option>
            <!-- Les autres options sont générées automatiquement par script.js
                 à partir des cours réellement présents, pour éviter tout
                 décalage entre le filtre et les données. -->
        </select>
    </div>

    <!-- LISTE DES COURS -->
    <main>
        <h2>Mes cours disponibles</h2>
        <div id="coursesGrid" class="grille"></div>
    </main>

    <!-- PIED DE PAGE -->
    <footer>
        <p>© 2025 Mes Cours - Fait avec ❤️</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
