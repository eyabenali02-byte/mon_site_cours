<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Cours &  Mes TD corrigés avec Résumé</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- EN-TÊTE -->
    <header>
        <h1>📚 Cours &  Mes TD corrigés avec Résumé</h1>
        <p>Pour aider les nouveaux étudiants LCE🎓</p>
    </header>

    <!-- RECHERCHE -->
    <div class="recherche">
        <input type="text" id="searchInput" placeholder="🔍 Rechercher un cours...">
        <select id="filterSelect">
            <option value="all">Toutes les matières</option>
            <!-- Les autres options sont générées automatiquement par script.js
                 à partir des cours réellement présents, pour éviter tout
                 décalage entre le filtre et les données. -->
        </select>
    </div>

    <!-- LISTE DES COURS -->
    <main>
        <h2>Mes cours disponibles</h2>
        <div id="coursesGrid" class="grille"></div>
    </main>

    <!-- PIED DE PAGE -->
    <footer>
        <p>© 2025 Mes Cours - Fait avec amour ❤️</p>
    </footer>

    <!-- MODAL : détail d'un cours avec ses chapitres/fichiers -->
    <div id="modal" class="modal">
        <div class="modal-contenu" role="dialog" aria-modal="true" aria-labelledby="modalTitre">
            <button id="modalFermer" class="modal-fermer" aria-label="Fermer">✕</button>
            <span id="modalMatiere" class="matiere"></span>
            <h3 id="modalTitre"></h3>
            <p id="modalDescription" class="modal-description"></p>
            <div id="modalListe" class="modal-liste"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
